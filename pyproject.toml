[project]
name = "lgbench"
version = "0.1.0"
description = "Latency and throughput benchmarks for the DataRobot LLM Gateway"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.60",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
catalog = ["datarobot>=3.6"]
dev = ["pytest>=8.0"]

[project.scripts]
lgbench = "lgbench.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lgbench"]
